<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin | SAM ICONIC Development</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #eef2f7; color: #333; }
  header { background: #1a3c5e; color: #fff; padding: 16px 20px; font-weight: bold; letter-spacing: 1px; }
  header span { color: #f0a500; }
  .wrap { max-width: 720px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 22px; margin-bottom: 20px; }
  h2 { color: #1a3c5e; font-size: 18px; margin-bottom: 16px; }
  label { display: block; font-size: 14px; font-weight: bold; color: #1a3c5e; margin: 12px 0 6px; }
  input, textarea {
    width: 100%; padding: 10px; border: 1px solid #ccd6e0; border-radius: 5px; font-size: 14px; font-family: inherit;
  }
  textarea { min-height: 82px; resize: vertical; }
  button {
    background: #f0a500; color: #1a3c5e; border: 0; padding: 11px 22px; border-radius: 5px;
    font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 16px;
  }
  button:hover { background: #d99400; }
  button:disabled { opacity: .6; cursor: default; }
  button.ghost { background: none; border: 1px solid #1a3c5e; color: #1a3c5e; margin: 0; padding: 6px 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .msg { margin-top: 14px; font-size: 14px; word-break: break-word; }
  .ok { color: #2f7d32; }
  .err { color: #c0392b; }
  .muted { color: #888; font-size: 14px; }
  .item { border-top: 1px solid #eee; padding: 12px 0; display: flex; justify-content: space-between; gap: 12px; }
  .item:first-child { border-top: 0; }
  .item .t { font-weight: bold; color: #1a3c5e; }
  .item .d { font-size: 13px; color: #666; margin: 2px 0 4px; }
  .item a { color: #1a3c5e; font-size: 13px; }
  .item .del {
    background: none; color: #c0392b; border: 1px solid #c0392b; padding: 4px 10px;
    font-size: 12px; border-radius: 4px; margin: 0; align-self: center;
  }
</style>
</head>
<body>
<header>SAM ICONIC <span>Development</span> Pvt Ltd &mdash; Admin</header>
<div class="wrap">

  <section id="loginView" class="card">
    <h2>Sign in</h2>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required />
      <button id="loginBtn" type="submit">Sign in</button>
      <div id="loginMsg" class="msg"></div>
    </form>
  </section>

  <section id="adminView" hidden>
    <div class="card">
      <div class="row">
        <span class="muted">Signed in as <b id="who"></b></span>
        <button id="signout" class="ghost" type="button">Sign out</button>
      </div>
    </div>

    <div class="card">
      <h2>Upload a project (PDF)</h2>
      <form id="uploadForm">
        <label for="pdf">PDF file *</label>
        <input type="file" id="pdf" accept="application/pdf,.pdf" required />
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. Iconic Green Meadows" />
        <label for="description">Description *</label>
        <textarea id="description" placeholder="e.g. DTCP approved plots at West Tambaram, development in progress" required></textarea>
        <button id="upBtn" type="submit">Upload</button>
        <div id="upMsg" class="msg"></div>
      </form>
    </div>

    <div class="card">
      <h2>Uploaded projects</h2>
      <div id="list" class="muted">Loading&hellip;</div>
    </div>
  </section>

</div>

<script>
(function () {
  var SB_URL = 'https://mmmyliccvuawhyhcxusw.supabase.co';
  var ANON   = 'sb_publishable_DCLPWFVScI8EadAJQCoT-A_bj5FTTP7';
  var BUCKET = 'project-pdfs';
  var LS_KEY = 'iconic_admin_session';

  var $ = function (id) { return document.getElementById(id); };
  var loginView = $('loginView'), adminView = $('adminView');
  var loginForm = $('loginForm'), loginMsg = $('loginMsg'), loginBtn = $('loginBtn');
  var uploadForm = $('uploadForm'), upMsg = $('upMsg'), upBtn = $('upBtn');

  function getSession() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; }
  }
  function setSession(s) { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {} }
  function clearSession() { try { localStorage.removeItem(LS_KEY); } catch (e) {} }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0, v = c === 'x' ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }

  function authHeaders() {
    var s = getSession();
    return { apikey: ANON, Authorization: 'Bearer ' + (s && s.access_token ? s.access_token : ANON) };
  }

  function refresh() {
    var s = getSession();
    if (!s || !s.refresh_token) return Promise.reject(new Error('no session'));
    return fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { apikey: ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('refresh failed')); })
      .then(function (j) {
        if (!j.access_token) return Promise.reject(new Error('refresh failed'));
        setSession({ access_token: j.access_token, refresh_token: j.refresh_token, email: (j.user && j.user.email) || s.email });
        return j;
      });
  }

  // fetch with the session token; on 401 try one refresh then retry
  function api(url, opts) {
    opts = opts || {};
    var base = opts.headers || {};
    var run = function () {
      var h = {}; for (var k in base) h[k] = base[k];
      var a = authHeaders(); for (var k2 in a) h[k2] = a[k2];
      return fetch(url, { method: opts.method || 'GET', headers: h, body: opts.body });
    };
    return run().then(function (r) {
      if (r.status !== 401) return r;
      return refresh().then(run).catch(function () {
        clearSession(); showLogin('Session expired - please sign in again.');
        return r;
      });
    });
  }

  function showLogin(m) {
    adminView.hidden = true; loginView.hidden = false;
    if (m) { loginMsg.className = 'msg err'; loginMsg.textContent = m; }
  }
  function showAdmin() {
    loginView.hidden = true; adminView.hidden = false;
    var s = getSession(); $('who').textContent = (s && s.email) || '';
    loadList();
  }

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    loginBtn.disabled = true;
    loginMsg.className = 'msg muted'; loginMsg.textContent = 'Signing in…';
    fetch(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { apikey: ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('email').value.trim(), password: $('password').value })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok && res.j.access_token) {
          setSession({
            access_token: res.j.access_token,
            refresh_token: res.j.refresh_token,
            email: (res.j.user && res.j.user.email) || $('email').value.trim()
          });
          loginMsg.textContent = ''; $('password').value = '';
          showAdmin();
        } else {
          loginMsg.className = 'msg err';
          loginMsg.textContent = res.j.error_description || res.j.msg || res.j.error || 'Sign in failed';
        }
      })
      .catch(function () { loginMsg.className = 'msg err'; loginMsg.textContent = 'Network error'; })
      .finally(function () { loginBtn.disabled = false; });
  });

  $('signout').addEventListener('click', function () {
    var s = getSession();
    if (s && s.access_token) {
      fetch(SB_URL + '/auth/v1/logout', { method: 'POST', headers: authHeaders() }).catch(function () {});
    }
    clearSession(); loginMsg.textContent = ''; showLogin();
  });

  function loadList() {
    var el = $('list');
    el.className = 'muted'; el.textContent = 'Loading…';
    api(SB_URL + '/rest/v1/projects?select=id,title,description,original_filename,storage_path,uploaded_at&order=uploaded_at.desc')
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (rows) {
        if (!rows.length) { el.className = 'muted'; el.textContent = 'No projects uploaded yet.'; return; }
        el.className = '';
        el.innerHTML = rows.map(function (p) {
          var url = SB_URL + '/storage/v1/object/public/' + BUCKET + '/' + encodeURIComponent(p.storage_path);
          return '<div class="item"><div>' +
            '<div class="t">' + esc(p.title) + '</div>' +
            '<div class="d">' + esc(p.description) + '</div>' +
            '<a href="' + url + '" target="_blank" rel="noopener">View PDF &#8599;</a>' +
            '</div><button class="del" data-id="' + esc(p.id) + '" data-path="' + esc(p.storage_path) + '">Delete</button></div>';
        }).join('');
      })
      .catch(function () { el.className = 'msg err'; el.textContent = 'Could not load the list.'; });
  }

  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('.del'); if (!b) return;
    if (!confirm('Delete this project?')) return;
    b.disabled = true;
    api(SB_URL + '/rest/v1/projects?id=eq.' + encodeURIComponent(b.dataset.id), { method: 'DELETE' })
      .then(function () {
        return api(SB_URL + '/storage/v1/object/' + BUCKET + '/' + encodeURIComponent(b.dataset.path), { method: 'DELETE' });
      })
      .then(loadList)
      .catch(function () { b.disabled = false; alert('Delete failed.'); });
  });

  uploadForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var file = $('pdf').files[0];
    if (!file) return;
    upBtn.disabled = true;
    upMsg.className = 'msg muted'; upMsg.textContent = 'Reading file…';

    file.arrayBuffer().then(function (buf) {
      var head = String.fromCharCode.apply(null, new Uint8Array(buf.slice(0, 5)));
      if (head !== '%PDF-') throw new Error('That file is not a PDF.');

      var id = uuid();
      var path = id + '.pdf';
      var origName = (file.name || 'project.pdf').replace(/[^\w.\- ]+/g, '_');
      var title = $('title').value.trim() || origName.replace(/\.pdf$/i, '');
      var description = $('description').value.trim();
      upMsg.textContent = 'Uploading ' + (file.size / 1048576).toFixed(1) + ' MB…';

      return api(SB_URL + '/storage/v1/object/' + BUCKET + '/' + encodeURIComponent(path), {
        method: 'POST',
        headers: { 'Content-Type': 'application/pdf', 'x-upsert': 'true' },
        body: buf
      }).then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw new Error('Storage: ' + t); });
        return api(SB_URL + '/rest/v1/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Prefer: 'return=representation' },
          body: JSON.stringify({
            id: id, title: title, description: description,
            original_filename: origName, storage_path: path, size_bytes: file.size
          })
        }).then(function (r2) {
          if (!r2.ok) {
            api(SB_URL + '/storage/v1/object/' + BUCKET + '/' + encodeURIComponent(path), { method: 'DELETE' });
            return r2.text().then(function (t) { throw new Error('Database: ' + t); });
          }
          return r2.json();
        });
      });
    }).then(function () {
      upMsg.className = 'msg ok'; upMsg.textContent = 'Uploaded.';
      uploadForm.reset(); loadList();
    }).catch(function (err) {
      upMsg.className = 'msg err'; upMsg.textContent = String(err && err.message ? err.message : err);
    }).finally(function () { upBtn.disabled = false; });
  });

  // boot
  if (getSession()) { showAdmin(); } else { showLogin(); }
})();
</script>
</body>
</html>
